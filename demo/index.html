<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revenue analysis · AskWise</title>
<style>
* { box-sizing: border-box }
body { margin: 0; color: #202124; background: white; font: 15px/1.55 Inter, system-ui, sans-serif }
header, .row { display: flex; align-items: center; justify-content: space-between; gap: 12px }
header { height: 64px; padding: 0 32px; border-bottom: 1px solid #ddd }
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 21px; letter-spacing: -.8px }
.mark { background: #222; color: white; border-radius: 6px; padding: 2px 7px; font: bold 20px/26px monospace }
button, summary { cursor: pointer }
button { font: inherit; font-size: 14px; border: 1px solid #cbcdce; color: inherit; background: white; border-radius: 6px; padding: 6px 13px }
button:hover { background: #f1f2f3; border-color: #888 }
button:focus-visible,summary:focus-visible { outline: 2px solid #246184; outline-offset: 3px }
main { display: grid; grid-template-columns: minmax(310px, 32%) 1fr; min-height: calc(100vh - 64px) }
aside { background: #f8f9f9; border-right: 1px solid #ddd; padding: 32px clamp(18px, 2.7vw, 44px) }
article { width: 100%; max-width: 930px; padding: 32px clamp(25px, 5vw, 90px) 48px }
h1,h2,h3,p { margin: 0 }
h1 { font-size: clamp(24px, 3vw, 40px); line-height: 1.2; font-weight: 620; letter-spacing: -.045em; margin: 7px 0 23px }
h2 { font-size: 17px; letter-spacing: -.35px }
small,.muted { color: #62686a; font-size: 13px }
aside h2 { margin-bottom: 24px }
.file { font: 600 15px ui-monospace, monospace }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums }
td,th { padding: 8px 3px; border-bottom: 1px solid #dfe2e2; text-align: left }
th { font-weight: 500; color: #606567; font-size: 12px }
td:last-child,th:last-child { text-align: right }
aside table { margin: 9px 0 20px }
.null { color: #8c5422; font: italic 13px Georgia, serif }
details { border-block: 1px solid #dbdede; padding: 12px 0; margin-top: 22px }
summary { font-size: 14px; font-weight: 600 }
pre { white-space: pre-wrap; font: 12px/1.65 ui-monospace, monospace }
.prompt { margin: 8px 0 16px }
.group { margin: 14px 0 }
.group p { margin-bottom: 6px; font-weight: 550 }
.group button { margin-right: 7px }
#history { padding: 0; list-style: none }
#history li { margin: 4px 0; border-left: 2px solid #aebdc0; padding-left: 10px; color: #51585b }
.results { margin-top: 28px; border-top: 1px solid #ddd; padding-top: 19px }
.results table { margin: 10px 0 }
tr.excluded td { color: #777; text-decoration: line-through; background: #f8f9f9 }
.answer { font-weight: 650 }
@media (max-width: 740px) {
  header { padding: 0 18px; height: 54px }
  main { display: flex; flex-direction: column }
  article,aside { padding: 22px 18px }
  aside { order: 2; border-top: 1px solid #ddd; border-right: 0 }
}
</style>
</head>
<body>
<header><strong class="brand"><span class="mark" aria-hidden="true">∑</span>AskWise</strong><button id="reset">Start over</button></header>
<main>
<aside aria-label="Workspace data"><h2>Data workspace</h2>
<div class="row"><span class="file">orders</span><small>4 rows</small></div>
<table aria-label="Order ledger"><thead><tr><th>Order ID</th><th>Status</th><th>Amount</th></tr></thead><tbody id="ledger"></tbody></table>
<p class="muted">The pending order has two possible amounts, $0 and $50.</p>
<details><summary>Inspect SQL</summary><pre id="sql"></pre></details>
</aside>
<article><small>Sales ledger / Revenue analysis</small>
<h1>What is our total revenue?</h1>
<ol id="history" aria-label="Your replies"></ol>
<section aria-live="polite"><h2 id="title" tabindex="-1"></h2><p class="prompt" id="reason"></p><div id="options"></div></section>
<section class="results"><div class="row"><h2>Execution results</h2><small id="count"></small></div>
<table aria-label="SQL execution results"><thead><tr><th>Order scope</th><th>Pending amount</th><th>Total</th></tr></thead><tbody id="matrix"></tbody></table>
<p class="muted" id="evidence"></p></section>
</article>
</main>
<script type="application/json" id="fixture">{"orders": [["O-101", "Completed", 60], ["O-102", "Completed", 10], ["O-103", "Pending", null], ["O-104", "Completed", 30]], "queries": ["SELECT SUM(amount) FROM orders", "SELECT SUM(amount) FROM orders WHERE status = 'Completed'"], "answers": [100, 150, 100, 100], "states": {"-1,-1": {"live": [0, 1, 2, 3], "answer": null, "witness": [[1, 3], [0, 1]]}, "-1,0": {"live": [0, 2], "answer": 100, "witness": [null, null]}, "-1,1": {"live": [1, 3], "answer": null, "witness": [[1, 3], null]}, "0,-1": {"live": [0, 1], "answer": null, "witness": [null, [0, 1]]}, "0,0": {"live": [0], "answer": 100, "witness": [null, null]}, "0,1": {"live": [1], "answer": 150, "witness": [null, null]}, "1,-1": {"live": [2, 3], "answer": 100, "witness": [null, null]}, "1,0": {"live": [2], "answer": 100, "witness": [null, null]}, "1,1": {"live": [3], "answer": 100, "witness": [null, null]}}}</script>
<script>
const data = JSON.parse(document.querySelector('#fixture').textContent);
const el = id => document.getElementById(id);
const scopes = ['All orders', 'Completed only'];
const amounts = ['$0', '$50'];
const questions = ['Which orders count?', 'What is the pending amount?'];
let selected = [-1, -1];

function render() {
  const state = data.states[selected.join(',')];
  const done = state.answer !== null;
  el('count').textContent = state.live.length + ' of 4 possible';
  el('matrix').innerHTML = data.answers.map((value, i) => {
    const live = state.live.includes(i);
    return '<tr class="' + (live ? '' : 'excluded') + '" aria-label="' +
      (live ? 'Possible' : 'Excluded') + ' execution"><td>' + scopes[Math.floor(i / 2)] +
      '</td><td>' + amounts[i % 2] + '</td><td class="answer">$' + value + '</td></tr>';
  }).join('');
  el('ledger').innerHTML = data.orders.map(([id, status, value]) => {
    const amount = value !== null ? '$' + value : amounts[selected[1]] || '<span class="null">NULL</span>';
    return '<tr><td>' + id + '</td><td>' + status + '</td><td>' + amount + '</td></tr>';
  }).join('');
  const remaining = state.witness.filter(Boolean).length;
  el('title').textContent = done ? 'Revenue is $' + state.answer + '.' : 'Clarify the total';
  el('reason').textContent = done
    ? (selected[0] === 1 && selected[1] < 0 ? 'The three completed orders sum to $100. The pending amount can stay unknown.'
      : selected[1] === 0 && selected[0] < 0 ? 'At $0, including the pending order leaves the total unchanged.'
      : 'The remaining execution matches both replies.')
    : (remaining === 2 ? 'The ledger supports totals of $100 and $150. Answer either question to narrow the result.'
      : 'Both totals are still possible. One question remains.');
  el('options').replaceChildren();
  state.witness.forEach((pair, coordinate) => {
    if (!pair) return;
    const group = document.createElement('div');
    group.className = 'group';
    const question = document.createElement('p');
    question.textContent = questions[coordinate];
    group.append(question);
    (coordinate ? amounts : scopes).forEach((label, index) => {
      const button = document.createElement('button');
      button.textContent = label;
      button.onclick = () => {
        selected[coordinate] = index;
        const reply = document.createElement('li');
        reply.textContent = questions[coordinate] + '  ' + label;
        el('history').append(reply);
        render();
        el('title').focus({preventScroll: true});
      };
      group.append(button);
    });
    el('options').append(group);
  });
  el('evidence').textContent = done ? 'All remaining executions agree on the total.'
    : 'Each row pairs one SQL query with one value for the pending order.';
}
el('sql').textContent = data.queries.join(';\n\n') + ';';
el('reset').onclick = () => {
  selected = [-1, -1];
  el('history').replaceChildren();
  render();
};
render();
</script>
</body>
</html>
